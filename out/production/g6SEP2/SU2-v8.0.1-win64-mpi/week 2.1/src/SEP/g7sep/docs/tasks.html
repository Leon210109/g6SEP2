<!DOCTYPE html>
<html>
  <head>
    <title>Tasks - Cloverville</title>
    <link href="styles.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="img/leaveicon.png">
  </head>
  <body>
    <img src="img/-2.jpeg" class="side-banner side-banner-left" alt="Left Banner">
    <img src="img/moestuin-1444x963-jpg-crop.jpeg" class="side-banner side-banner-right" alt="Right Banner">
    <h3>Current Tasks in Cloverville</h3>
    <p>Here you can find a list of current tasks that residents of Cloverville can participate in to earn personal points and contribute to the community.</p>

    <div class="task-table" id="tasks-list">
      <div class="task-header">
        <div>Task Name</div>
        <div>Type</div>
        <div>Points</div>
      </div>
    </div>

    <div id="task-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 class="modal-title" id="modal-task-name"></h2>
        <div class="modal-info"><span class="modal-label">Type:</span> <span id="modal-task-type"></span></div>
        <div class="modal-info"><span class="modal-label">Points:</span> <span id="modal-task-points"></span></div>
        <div class="modal-info"><span class="modal-label">Description:</span> <p id="modal-task-description" style="margin-top:5px;color:#666;"></p></div>
      </div>
    </div>

    <div id="tasks-status" style="font-size:0.9em;color:#444;margin-bottom:8px;text-align:center;"></div>

    <script src="funcs.js"></script>
    <script src="load_json.js"></script>
  </body>
</html>
