<!DOCTYPE html>
<html>
  <head>
    <title>Trades - Cloverville</title>
    <link href="styles.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="img/leaveicon.png">
  </head>
  <body>
    <img src="img/-2.jpeg" class="side-banner side-banner-left" alt="Left Banner">
    <img src="img/moestuin-1444x963-jpg-crop.jpeg" class="side-banner side-banner-right" alt="Right Banner">
    <h3>Current Trades in Cloverville</h3>
    <p>Here you can find a list of current trades available in Cloverville. Browse active trades and participate in the community economy.</p>

    <div class="trade-table" id="trades-list">
      <div class="trade-header">
        <div>Trade Name</div>
        <div>Trader</div>
        <div>Points</div>
      </div>
    </div>

    <div id="trade-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 class="modal-title" id="modal-trade-name"></h2>
        <div class="modal-info"><span class="modal-label">Trader:</span> <span id="modal-trade-trader"></span></div>
        <div class="modal-info"><span class="modal-label">Points Cost:</span> <span id="modal-trade-points"></span></div>
        <div class="modal-info"><span class="modal-label">Description:</span> <p id="modal-trade-description" style="margin-top:5px;color:#666;"></p></div>
      </div>
    </div>

    <div id="trades-status" style="font-size:0.9em;color:#444;margin-bottom:8px;text-align:center;"></div>

    <script src="funcs.js"></script>
    <script src="load_json.js"></script>
  </body>
</html>
